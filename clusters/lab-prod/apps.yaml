apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: apps
  namespace: flux-system
spec:
  interval: 5m
  path: ./apps-v2/environments/prod/clusters/lab-prod
  prune: true
  wait: false
  dependsOn:
    - name: apps-sources
    - name: infra-core
  sourceRef:
    kind: GitRepository
    name: flux-system
  
