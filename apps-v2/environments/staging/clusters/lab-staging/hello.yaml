apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: hello
  namespace: flux-system
spec:
  interval: 1m
  path: ./deploy/staging
  prune: true
  wait: true
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: hello
  # Per-cluster values come from the cluster's own ConfigMap (clusters/lab-staging/cluster-config.yaml)
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: cluster-config
