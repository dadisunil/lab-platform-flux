name: deletion-warning
on:
  pull_request:
    paths:
      - "clusters/**"
      - "infra-v2/**"
      - "apps-v2/**"
permissions:
  contents: read
  pull-requests: write
jobs:
  warn:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Detect deleted manifests
        id: del
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          deleted="$(git diff --name-only --diff-filter=D "origin/${BASE_REF}...HEAD" -- clusters infra-v2 apps-v2 | tr '\n' ' ')"
          echo "deleted=${deleted}" >> "$GITHUB_OUTPUT"
      - name: Warn on the pull request
        if: steps.del.outputs.deleted != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          DELETED: ${{ steps.del.outputs.deleted }}
        run: |
          gh pr comment "${PR_NUMBER}" --body "WARNING: this PR deletes manifests (${DELETED}). With prune enabled, Flux will DELETE the matching live resources. Confirm that is intended."

